<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TERMINAL X</title>

<link rel="stylesheet"
href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<!-- =========================
SIDEBAR
========================= -->

<div class="sidebar">

    <!-- LOGO -->

    <div class="logo-area">

        <img
        src="assets/logo.png"
        class="main-logo">

        <h2>TERMINAL X</h2>

    </div>

    <!-- MENU -->

    <div class="menu">

        <div class="menu-item active">

            <i class="fa-solid fa-message"></i>

            <span>Chats</span>

        </div>

        <div class="menu-item">

            <i class="fa-solid fa-circle-dot"></i>

            <span>Status</span>

        </div>

        <div class="menu-item">

            <i class="fa-solid fa-users"></i>

            <span>Channels</span>

        </div>

        <div class="menu-item">

            <i class="fa-solid fa-gear"></i>

            <span>Settings</span>

        </div>

    </div>

    <!-- OWNER SECTION -->

    <div class="owner-box">

        <h3>OWNERS</h3>

        <a
        href="https://wa.me/2348072285862"
        target="_blank">

        DANNY

        </a>

        <a
        href="https://wa.me/2349066760078"
        target="_blank">

        ZEUS

        </a>

        <a
        href="https://wa.me/2347032201835"
        target="_blank">

        NICKY TECH

        </a>

    </div>

</div>

<!-- =========================
CHAT AREA
========================= -->

<div class="chat-container">

    <!-- TOP BAR -->

    <div class="top-bar">

        <div class="user-info">

            <img
            src="assets/default-avatar.png"
            class="avatar">

            <div>

                <h3>TERMINAL X BOT</h3>

                <p>Online</p>

            </div>

        </div>

        <div class="top-icons">

            <i class="fa-solid fa-phone"></i>

            <i class="fa-solid fa-video"></i>

            <i class="fa-solid fa-ellipsis-vertical"></i>

        </div>

    </div>

    <!-- CHAT MESSAGES -->

    <div id="messages">

        <!-- BOT WELCOME -->

        <div class="message bot-message">

            <div class="message-text">

                Welcome to TERMINAL X ⚡

            </div>

        </div>

    </div>

    <!-- INPUT AREA -->

    <div class="input-area">

        <input
        type="text"
        id="user-input"
        placeholder="Type a message...">

        <button id="send-btn">

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </div>

</div>

<!-- =========================
SCRIPTS
========================= -->

<script src="script.js"></script>

</body>

</html>
