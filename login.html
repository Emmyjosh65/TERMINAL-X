<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TERMINAL X - Login</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <img
        src="assets/logo.png"
        class="logo">

        <h1>TERMINAL X</h1>

        <p class="subtitle">
            Login to continue
        </p>

        <input
        type="email"
        id="loginEmail"
        placeholder="Email">

        <input
        type="password"
        id="loginPassword"
        placeholder="Password">

        <button id="loginBtn">

            LOGIN

        </button>

        <p class="switch-text">

            Don’t have an account?

            <a href="signup.html">

                Create Account

            </a>

        </p>

    </div>

</div>

<script type="module"
src="firebase.js"></script>

</body>

</html>
