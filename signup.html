<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TERMINAL X - Sign Up</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <img
        src="assets/logo.png"
        class="logo">

        <h1>TERMINAL X</h1>

        <p class="subtitle">
            Create your account
        </p>

        <input
        type="text"
        id="username"
        placeholder="Username">

        <input
        type="email"
        id="email"
        placeholder="Email">

        <input
        type="password"
        id="password"
        placeholder="Password">

        <button id="signupBtn">

            CREATE ACCOUNT

        </button>

        <p class="switch-text">

            Already have an account?

            <a href="login.html">

                Login

            </a>

        </p>

    </div>

</div>

<script type="module"
src="firebase.js"></script>

</body>

</html>
